interface:
  display_name: "Живое русское письмо"
  short_description: "Русские тексты с сохранением фактов, регистра и авторского голоса"
  default_prompt: "Используй $human-writing-ru. Напиши или отредактируй русский текст в нужном жанре и регистре; сохрани фактические границы, авторскую позицию и индивидуальный голос, не подменяй содержание шаблонной риторикой."
